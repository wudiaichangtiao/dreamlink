name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships a preinstalled Android SDK (ANDROID_HOME set,
      # licenses already accepted). sdkmanager is NOT on PATH, so we locate it
      # explicitly. This step is best-effort and must never fail the build:
      # AGP 8.1.4 auto-downloads any missing platform/build-tools during the
      # Gradle build (licenses are pre-accepted on the runner).
      - name: Prepare Android SDK (best-effort)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # make sure AGP can find the SDK
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ]; then
            echo "sdk.dir=$SDK_DIR" > android/local.properties
          fi
          # try to pre-install 34 components if we can find sdkmanager
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] && [ -n "$SDK_DIR" ]; then
            for c in "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
                     "$SDK_DIR/cmdline-tools/bin/sdkmanager"; do
              [ -x "$c" ] && SDKMGR="$c" && break
            done
          fi
          if [ -n "$SDKMGR" ]; then
            echo "using sdkmanager: $SDKMGR"
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not found; relying on AGP auto-download"
          fi
          true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Assemble debug APK
        working-directory: ./android
        env:
          # Injected from the repo secret GITEE_TOKEN; build.gradle bakes it
          # into BuildConfig.DREAMLINK_TOKEN. Never committed to git.
          DREAMLINK_GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dreamlink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

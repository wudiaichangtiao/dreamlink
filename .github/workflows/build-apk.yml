name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships a preinstalled Android SDK (ANDROID_HOME set,
      # licenses already accepted, sdkmanager on PATH). We deliberately do NOT
      # use android-actions/setup-android: it downloads cmdline-tools from the
      # GitHub API and intermittently fails with 403 on anonymous rate limits.
      - name: Ensure platform + build-tools 34 (downloaded from Google, not rate-limited)
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Assemble debug APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dreamlink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

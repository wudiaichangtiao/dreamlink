plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dreamlink.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dreamlink.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Deliberately zero dependencies: plain Java + framework APIs only.
// Keeps the APK ~1MB and cold start minimal (requirement: fast launch).
